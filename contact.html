    <header>
        <nav>
            <ul>

                <li><a href="experiments.html">Tag Experiments</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Me</h1>

        <form action="#" method="post">
            <div class="form-name">
                <label for="name">Enter your name:</label>
                <input type="text" name="name" id="name" required/>
            </div>

            <div class="form-email">
                <label for="email">Enter your email:</label>
                <input type="email" name="email" id="email" required/>
            </div>

            <div class="form-message">
                <label for="message">Message:</label>
                <textarea 
                    name="message" 
                    id="message" 
                    rows="5" 
                    cols="30" 
                    placeholder="Let me know about you..." 
                    required></textarea><br>
            </div>

            <fieldset>
                <legend>Choose your favorite agent:</legend>

                <input type="radio" name="agent" id="claude" required/>
                <label for="claude">Claude Code</label>
                
                <input type="radio" name="agent" id="codex" required/>
                <label for="codex">Codex</label>
            </fieldset>

            <div class="form-submit">
                <input type="submit" value="Send">
            </div>
        </form>
    </main>
    <footer>

</body>
